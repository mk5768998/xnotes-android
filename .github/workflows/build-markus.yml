# Baut Markus' X-Notes-Version auf den Servern von GitHub (GitHub Actions).
# Läuft bei jedem Push auf den Branch "markus" oder per Knopf ("Run workflow").
# Ergebnis: eine APK zum Herunterladen unter Actions → Lauf → Artifacts.
name: Build Markus APK

on:
  push:
    branches: [markus]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Versionen wie im Projekt festgelegt (app/build.gradle.kts).
      - name: NDK und CMake installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1"

      # Immer derselbe Signaturschlüssel, sonst lässt Android keine Updates zu
      # (jeder GitHub-Server würde sonst einen neuen Debug-Schlüssel erzeugen).
      - name: Festen Debug-Schlüssel einsetzen
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_B64" || { echo "Secret DEBUG_KEYSTORE_B64 fehlt"; exit 1; }
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          # Wird in app/build.gradle.kts als Debug-Schlüssel eingesetzt.
          echo "XNOTES_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5

      - name: APK bauen (nur arm64 für das Xiaomi Pad 7)
        run: ./gradlew assembleDebug -Pxnotes.abi=arm64-v8a

      # Bricht ab, wenn die APK nicht mit Markus' Schlüssel signiert ist.
      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk \
            | grep -i "95e0428294f37c2c03a2abaefbce12619e7aa9496e0f7df8f1ae265cd380fd48"

      - uses: actions/upload-artifact@v5
        with:
          name: xnotes-markus-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
